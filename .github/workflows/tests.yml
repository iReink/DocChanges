name: Проверка проекта
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-comparison.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONUTF8: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/document_info.test.mjs tests/document_viewer.test.mjs tests/api_address.test.mjs
