<text x="1125" y="1094" text-anchor="start" font-family="Arial" font-size="12" fill="#24483b">17. Таблицы и точный diff</text>
<line x1="1050" y1="1154" x2="1285" y2="1154" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="1167.5" y="1146" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">18. Извлечение сущностей</text>
<line x1="1285" y1="1212" x2="1050" y2="1212" stroke="#315e50" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1167.5" y="1204" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">19. Сущности или ошибка</text>
<path d="M1050,1252 h65 v22 h-65" fill="none" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="1125" y="1268" text-anchor="start" font-family="Arial" font-size="12" fill="#24483b">20. Классификация, подписи, полнота</text>
