<rect x="315" y="706" width="765" height="242" fill="#f0f6f0" fill-opacity="0.6" stroke="#afc3b4"/>
<text x="322" y="719" font-family="Arial" font-size="10" fill="#536c5c">loop Для каждой версии независимо</text>
<rect x="1020" y="938" width="295" height="126" fill="#f0f6f0" fill-opacity="0.6" stroke="#afc3b4"/>
<text x="1027" y="951" font-family="Arial" font-size="10" fill="#536c5c">opt Неоднозначные соответствия</text>
<rect x="1020" y="1112" width="295" height="126" fill="#f0f6f0" fill-opacity="0.6" stroke="#afc3b4"/>
<text x="1027" y="1125" font-family="Arial" font-size="10" fill="#536c5c">opt Изменённые контексты</text>
<rect x="315" y="1344" width="295" height="126" fill="#f0f6f0" fill-opacity="0.6" stroke="#afc3b4"/>
<text x="322" y="1357" font-family="Arial" font-size="10" fill="#536c5c">loop До завершения</text>
<rect x="315" y="1808" width="295" height="68" fill="#f0f6f0" fill-opacity="0.6" stroke="#afc3b4"/>
<text x="322" y="1821" font-family="Arial" font-size="10" fill="#536c5c">loop Пока открыт результат</text>
<line x1="110" y1="168" x2="345" y2="168" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="227.5" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">1. Два документа, подписи, ФИО</text>
