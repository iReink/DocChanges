<text x="462.5" y="218" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">2. POST comparisons</text>
<line x1="580" y1="284" x2="815" y2="284" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="697.5" y="276" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">3. Сохранить оригиналы</text>
