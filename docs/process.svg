<text x="932.5" y="1320" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">21. Результат и страницы</text>
<line x1="345" y1="1386" x2="580" y2="1386" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="462.5" y="1378" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">22. Состояние задачи</text>
<line x1="580" y1="1444" x2="345" y2="1444" stroke="#315e50" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="462.5" y="1436" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">23. Этап и предупреждения</text>
<line x1="345" y1="1502" x2="580" y2="1502" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="462.5" y="1494" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">24. Результат и PDF страниц</text>
<line x1="580" y1="1560" x2="345" y2="1560" stroke="#315e50" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="462.5" y="1552" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">25. Различия и координаты</text>
<line x1="345" y1="1618" x2="110" y2="1618" stroke="#315e50" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="227.5" y="1610" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">26. Две версии с подсветкой</text>
<line x1="110" y1="1676" x2="345" y2="1676" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="227.5" y="1668" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">27. Скачать отчёт</text>
<line x1="345" y1="1734" x2="580" y2="1734" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="462.5" y="1726" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">28. PDF, DOCX или JSON</text>
<line x1="580" y1="1792" x2="345" y2="1792" stroke="#315e50" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="462.5" y="1784" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">29. Автономный файл</text>
<line x1="345" y1="1850" x2="580" y2="1850" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="462.5" y="1842" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">30. Heartbeat</text>
<line x1="580" y1="1908" x2="815" y2="1908" stroke="#315e50" marker-end="url(#arrow)"/>
<text x="697.5" y="1900" text-anchor="middle" font-family="Arial" font-size="12" fill="#24483b">31. Удалить по кнопке или после простоя</text>
